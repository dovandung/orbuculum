name: Build Windows binaries

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  win64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libelf
            mingw-w64-x86_64-capstone
            git
            zip
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-ca-certificates
            mingw-w64-x86_64-gdb
      - uses: actions/checkout@v4
        with:
          path: ./orbuculum
      - uses: actions/checkout@v4
        with:
          path: ./libusb/src
          repository: Novakov/libusb
          ref: d67cf6868b91c5972aa4225caf9b924f25a9bda6

      - run: ./bootstrap.sh
        working-directory: ./libusb/src
      - run: mkdir ./libusb/build
      - run: ../src/configure --prefix=`realpath ../install`
        working-directory: ./libusb/build
      - run: make -j4 install
        working-directory: ./libusb/build

      # Newer GCC warns about code in the bundled libdwarf, which is built with -Werror.
      - run: "export PKG_CONFIG_PATH=`realpath ../libusb/install/lib/pkgconfig` && meson setup ./build --prefix A:/ -Dwerror=false -Dlibdwarf:werror=false"
        working-directory: ./orbuculum
      - run: ninja -C ./build
        working-directory: ./orbuculum
      - run: meson install -C ./build --destdir ./install --strip
        working-directory: ./orbuculum
      - run: cp ./libusb/install/bin/libusb-1.0.dll ./orbuculum/build/install/bin
      - name: Check all tools were built
        working-directory: ./orbuculum/build/install/bin
        run: |
          for t in orbuculum orbcat orbtop orbmortem orbprofile orbstat orbtrace orbdump orbzmq orblcd; do
            [ -f $t.exe ] || { echo "::error::$t.exe was not built"; missing=1; }
          done
          [ -z "$missing" ]
      - name: Bundle MinGW DLLs
        working-directory: ./orbuculum/build/install/bin
        run: |
          # Copy every MinGW runtime DLL the tools need, so they run without MSYS2 installed.
          for i in 1 2 3; do
            for f in *.exe *.dll; do
              ldd "$f" | awk '/\/mingw64\// {print $3}' | while read d; do
                [ -f "$(basename "$d")" ] || cp -v "$d" .
              done
            done
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: orbuculum-win64
          path: ./orbuculum/build/install/**/*.*
          if-no-files-found: error

      # Debug kit: tools with debug symbols (not stripped) plus gdb, to get a backtrace of a crash:
      #   gdb -batch -ex run -ex bt --args orbprofile.exe <options>
      - name: Debug kit
        run: |
          mkdir -p ./debugkit
          cp ./orbuculum/build/*.exe ./debugkit/
          cp ./orbuculum/build/install/bin/*.dll ./debugkit/
          cp /mingw64/bin/gdb.exe ./debugkit/
          cd ./debugkit
          for i in 1 2 3; do
            for f in *.exe *.dll; do
              ldd "$f" | awk '/\/mingw64\// {print $3}' | while read d; do
                [ -f "$(basename "$d")" ] || cp "$d" .
              done
            done
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: orbuculum-win64-debug
          path: ./debugkit/*
          if-no-files-found: error
